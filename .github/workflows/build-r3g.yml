name: Build ImmortalWrt for xiaomi_mi-router-3g


on:
  workflow_dispatch:
  push:
    paths:
      - '.config'


jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: build-r3g
      cancel-in-progress: false


    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1


      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget


      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a


      - name: Embed domestic mirror sources into firmware
        run: |
          mkdir -p files/etc/opkg
          cat > files/etc/opkg/distfeeds.conf <<'EOF'
